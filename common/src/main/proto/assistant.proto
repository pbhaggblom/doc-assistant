syntax = "proto3";

option java_package = "org.pbhaggblom.assistant";
option java_outer_classname = "AssistantProto";
option java_multiple_files = true;

package ai_assistant;

message AssistantRequest {
  string question = 1;
}

message AssistantResponse {
  string text_chunk = 1;
}

service AssistantService {
  rpc ResultStream (AssistantRequest) returns (stream AssistantResponse) {}
}