syntax = "proto3";

option java_package = "org.pbhaggblom";
option java_outer_classname = "AssistantProto";
option java_multiple_files = true;

package ai_assistant;

message DocRequest {
  string question = 1;
}

message DocResponse {
  string text_chunk = 1;
}

service AssistantService {
  rpc ResultStream (DocRequest) returns (stream DocResponse) {}
}